name: Desktop build

# Builds the desktop installers on GitHub runners (public repo = free).
#   • push to prod: every push to the `prod` branch builds the installers
#   • manual run:   Actions → "Desktop build" → Run workflow → download artifacts
#
# The DMG can only be produced on macOS (hdiutil), so macOS builds happen on a
# macos runner — nobody needs a Mac locally anymore.
# This workflow lives at the ROOT of the desktop-only repo (.github/workflows/).

on:
  workflow_dispatch: {}
  push:
    branches:
      - prod

jobs:
  mac:
    name: macOS (.dmg)
    runs-on: macos-latest
    env:
      # Unsigned pilot build: never try to codesign on the runner.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # --publish never: CI detection triggers implicit publishing (which needs
      # GH_TOKEN). We only want artifacts — never auto-publish.
      - name: Build DMG (Intel + Apple Silicon)
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Upload DMGs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: kova-dmg
          path: dist/*.dmg
          if-no-files-found: error
